  <text x="400" y="500" font-family="sans-serif" font-size="34" fill="#e7edf2" text-anchor="middle" opacity="0.85">RAINDROP TEE</text>
  <text x="400" y="545" font-family="sans-serif" font-size="20" fill="#9fb0bd" text-anchor="middle">HEM 밑단 그라데이션</text>

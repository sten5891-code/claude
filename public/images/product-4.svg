  <rect width="800" height="1000" fill="url(#bg)"/>
  <!-- t-shirt silhouette -->
  <path d="M250 230 L160 300 L210 400 L270 360 L270 820 Q400 850 530 820 L530 360 L590 400 L640 300 L550 230 Q480 280 400 280 Q320 280 250 230 Z" fill="url(#tee)"/>
